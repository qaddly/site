<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qaddlyokey — Главная</title>
    <link rel="stylesheet" href="style.css?v=11">
    <style>
        @media (max-width: 768px) {
            body {
                overflow: visible !important;
            }
            body > *:not(.splash-screen) {
                transform: scale(0.3);
                transform-origin: 0 0;
                width: 333.33%;
            }
        }
    </style>
</head>
<body>
    <div class="splash-screen" id="splash">
        <div class="splash-center-triangle"></div>
        <div class="splash-left-triangle"></div>
        <div class="splash-right-triangle"></div>
    </div>

    <div class="top-bar">
        <span class="top-bar-text">Qaddly</span>
    </div>

    <div class="content-wrapper">
        <script src="script.js"></script>
    </div>
</body>
</html>
